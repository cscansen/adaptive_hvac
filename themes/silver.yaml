# Silver — gunmetal dark, brushed-silver glow on active. Generated by themes/build_themes.py; edit the palette there.
Silver:
  modes:
    dark:
      glow-backdrop: "#1a1c20"
      glow-solid: "#24272c"
      glow-blur: "none"
      glow-card-shadow: "none"
      glow-bg: "#1a1c20"
      glow-card: "#24272c"
      glow-card-hi: "#2e3137"
      glow-line: "rgba(220, 228, 236, 0.12)"
      glow-line-strong: "rgba(220, 228, 236, 0.20)"
      glow-accent: "#e3e8ee"
      glow-fill: "linear-gradient(135deg, #8e949c 0%, #60656c 45%, #3d4046 100%)"
      glow-border: "rgba(225, 232, 240, 0.45)"
      glow-border-strong: "rgba(235, 240, 246, 0.60)"
      glow-shadow: "0 0 26px rgba(200, 215, 230, 0.16)"
      glow-text: "#f2f4f7"
      glow-muted: "#adb3bb"
      glow-faint: "#737881"
      primary-color: "var(--glow-accent)"
      accent-color: "var(--glow-accent)"
      primary-background-color: "var(--glow-bg)"
      lovelace-background: "var(--glow-backdrop)"
      secondary-background-color: "var(--glow-solid)"
      card-background-color: "var(--glow-solid)"
      ha-card-background: "var(--glow-card)"
      ha-card-border-radius: "20px"
      ha-card-border-color: "var(--glow-line)"
      ha-card-border-width: "1px"
      ha-card-box-shadow: "none"
      primary-text-color: "var(--glow-text)"
      secondary-text-color: "var(--glow-muted)"
      disabled-text-color: "var(--glow-faint)"
      divider-color: "var(--glow-line)"
      state-icon-color: "var(--glow-muted)"
      state-active-color: "var(--glow-accent)"
      state-on-color: "var(--glow-accent)"
      state-switch-on-color: "var(--glow-accent)"
      state-media_player-active-color: "var(--glow-accent)"
      tile-color: "var(--glow-accent)"
      app-header-background-color: "var(--glow-bg)"
      app-header-text-color: "var(--glow-text)"
      app-header-selection-bar-color: "var(--glow-accent)"
      switch-checked-color: "var(--glow-accent)"
      slider-color: "var(--glow-accent)"
      slider-bar-color: "var(--glow-line-strong)"
      mdc-theme-primary: "var(--glow-accent)"
