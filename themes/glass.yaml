# Glass — frosted translucent glass over soft silver light. Generated by themes/build_themes.py; edit the palette there.
Glass:
  modes:
    dark:
      glow-backdrop: "radial-gradient(circle at 12% 18%, rgba(175, 190, 210, 0.30), transparent 42%), radial-gradient(circle at 88% 12%, rgba(125, 135, 155, 0.30), transparent 46%), radial-gradient(circle at 62% 88%, rgba(205, 210, 220, 0.18), transparent 46%), linear-gradient(160deg, #1d2027 0%, #0d0f13 100%)"
      glow-solid: "#1d2026"
      glow-blur: "blur(20px) saturate(160%)"
      glow-card-shadow: "inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 30px rgba(0, 0, 0, 0.30)"
      glow-bg: "#0d0f13"
      glow-card: "rgba(255, 255, 255, 0.06)"
      glow-card-hi: "rgba(255, 255, 255, 0.09)"
      glow-line: "rgba(255, 255, 255, 0.14)"
      glow-line-strong: "rgba(255, 255, 255, 0.24)"
      glow-accent: "#ffffff"
      glow-fill: "linear-gradient(135deg, rgba(255, 255, 255, 0.30) 0%, rgba(220, 228, 238, 0.15) 50%, rgba(255, 255, 255, 0.07) 100%)"
      glow-border: "rgba(255, 255, 255, 0.45)"
      glow-border-strong: "rgba(255, 255, 255, 0.60)"
      glow-shadow: "inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 0 28px rgba(220, 230, 245, 0.18)"
      glow-text: "#f7f8fa"
      glow-muted: "#b9bfc8"
      glow-faint: "#7d838c"
      primary-color: "var(--glow-accent)"
      accent-color: "var(--glow-accent)"
      primary-background-color: "var(--glow-bg)"
      lovelace-background: "var(--glow-backdrop)"
      secondary-background-color: "var(--glow-solid)"
      card-background-color: "var(--glow-solid)"
      ha-card-background: "var(--glow-card)"
      ha-card-border-radius: "20px"
      ha-card-border-color: "var(--glow-line)"
      ha-card-border-width: "1px"
      ha-card-box-shadow: "none"
      primary-text-color: "var(--glow-text)"
      secondary-text-color: "var(--glow-muted)"
      disabled-text-color: "var(--glow-faint)"
      divider-color: "var(--glow-line)"
      state-icon-color: "var(--glow-muted)"
      state-active-color: "var(--glow-accent)"
      state-on-color: "var(--glow-accent)"
      state-switch-on-color: "var(--glow-accent)"
      state-media_player-active-color: "var(--glow-accent)"
      tile-color: "var(--glow-accent)"
      app-header-background-color: "var(--glow-bg)"
      app-header-text-color: "var(--glow-text)"
      app-header-selection-bar-color: "var(--glow-accent)"
      switch-checked-color: "var(--glow-accent)"
      slider-color: "var(--glow-accent)"
      slider-bar-color: "var(--glow-line-strong)"
      mdc-theme-primary: "var(--glow-accent)"
