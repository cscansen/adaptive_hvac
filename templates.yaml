# =========================
# Master Bedroom - Stable Sensors
# =========================
- trigger:
    - platform: state
      entity_id:
        - sensor.meter_pro_89_humidity
        - sensor.meter_pro_89_temperature
  sensor:
    - name: "Master BR Humidity (Stable)"
      unique_id: master_br_humidity_stable
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      state: >
        {% set v = states('sensor.meter_pro_89_humidity') | float(default=none) %}
        {% if v is not none %}
          {{ v }}
        {% else %}
          {{ this.state }}
        {% endif %}
      availability: >
        {% set v = states('sensor.meter_pro_89_humidity') | float(default=none) %}
        {{ (v is not none) or (this.state not in ['unknown','none','']) }}

    - name: "Master BR Temperature (Stable)"
      unique_id: master_br_temperature_stable
      unit_of_measurement: "°F"
      device_class: temperature
      state_class: measurement
      state: >
        {% set v = states('sensor.meter_pro_89_temperature') | float(default=none) %}
        {% if v is not none %}
          {{ v }}
        {% else %}
          {{ this.state }}
        {% endif %}
      availability: >
        {% set v = states('sensor.meter_pro_89_temperature') | float(default=none) %}
        {{ (v is not none) or (this.state not in ['unknown','none','']) }}

