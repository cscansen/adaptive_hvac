# =========================
# Master Bedroom Bed Presence - Stable Binary Sensors
# =========================
- binary_sensor:
    - name: "Master Bed – Caleb In Bed"
      unique_id: master_bed_caleb_in_bed
      state: "{{ is_state('binary_sensor.master_bedroom_bed_presence_bed_occupied_right', 'on') }}"
      delay_on: "00:00:05"
      delay_off: "00:01:00"

    - name: "Master Bed – Tia In Bed"
      unique_id: master_bed_tia_in_bed
      state: "{{ is_state('binary_sensor.master_bedroom_bed_presence_bed_occupied_left', 'on') }}"
      delay_on: "00:00:05"
      delay_off: "00:01:00"

    - name: "Master Bed – Anyone In Bed"
      unique_id: master_bed_anyone_in_bed
      state: "{{ is_state('binary_sensor.master_bedroom_bed_presence_bed_occupied_either', 'on') }}"
      delay_on: "00:00:05"
      delay_off: "00:01:30"

    - name: "Master Bed – Both In Bed"
      unique_id: master_bed_both_in_bed
      state: "{{ is_state('binary_sensor.master_bedroom_bed_presence_bed_occupied_both', 'on') }}"
      delay_on: "00:00:10"
      delay_off: "00:02:00"

- sensor:
    - name: Upstairs Average Temperature
      unique_id: upstairs_average_temperature
      unit_of_measurement: °F
      device_class: temperature
      state_class: measurement
      state: |
        {% set caleb = states("sensor.caleb_s_office_hygrometer_temperature") | float(0) %}
        {% set tia = states("sensor.tias_office_hygrometer_temperature") | float(0) %}
        {% set master = states("sensor.meter_pro_2689_temperature") | float(0) %}
        {% if caleb > 0 and tia > 0 and master > 0 %}
          {{ ((caleb + tia + master) / 3) | round(2) }}
        {% else %}
          unknown
        {% endif %}
      availability: |
        {{ states("sensor.caleb_s_office_hygrometer_temperature") not in ["unavailable","unknown"]
           and states("sensor.tias_office_hygrometer_temperature") not in ["unavailable","unknown"]
           and states("sensor.meter_pro_2689_temperature") not in ["unavailable","unknown"] }}

# =========================
# Thermostat Fan State — text sensor for history graph
# =========================
- sensor:
    - name: "Thermostat Fan State"
      unique_id: thermostat_fan_state
      icon: mdi:fan
      state: >
        {% set m = state_attr('climate.downstairs_thermostat', 'fan_mode') %}
        {% if m == 'on' %}running{% elif m is not none %}auto{% else %}unknown{% endif %}
      availability: >
        {{ states('climate.downstairs_thermostat') not in ['unavailable','unknown'] }}

# =========================
# Front Porch — wind-gated presence zones
# Calibrated 2026-06-14: 0.75m resolution, G2=5ft (swings), G7=17ft (stoop)
# Empty baseline: G2=44, G7=43 | Swings occupied: G2=100, G7≤56 | Stoop occupied: G7=100
# =========================
- binary_sensor:
    - name: "Front Porch Swings Occupied"
      unique_id: front_porch_swings_occupied
      device_class: occupancy
      state: >-
        {% set g2 = states('sensor.front_porch_front_porch_presence_g2_still_energy') | float(0) %}
        {% set g7 = states('sensor.front_porch_front_porch_presence_g7_still_energy') | float(0) %}
        {% set occupied = g2 > 75 and g7 < 75 %}
        {% set windy_night = state_attr('weather.home', 'wind_speed') | float(0) >= 12
                             and is_state('sun.sun', 'below_horizon') %}
        {{ occupied and not windy_night }}

    - name: "Front Porch Stoop Occupied"
      unique_id: front_porch_stoop_occupied
      device_class: occupancy
      state: >-
        {% set g7 = states('sensor.front_porch_front_porch_presence_g7_still_energy') | float(0) %}
        {% set occupied = g7 > 75 %}
        {% set windy_night = state_attr('weather.home', 'wind_speed') | float(0) >= 12
                             and is_state('sun.sun', 'below_horizon') %}
        {{ occupied and not windy_night }}

# =========================
# Gazebo Occupied — wind-gated presence
# =========================
- binary_sensor:
    - name: "Gazebo Occupied"
      unique_id: gazebo_occupied_wind_gated
      device_class: occupancy
      state: >-
        {% set still_energy = states('sensor.gazebo_presence_sensor_still_energy') | float(0) %}
        {% set occupied = still_energy > 40 %}
        {% set windy_night = state_attr('weather.home', 'wind_speed') | float(0) >= 12
                             and is_state('sun.sun', 'below_horizon') %}
        {{ occupied and not windy_night }}
