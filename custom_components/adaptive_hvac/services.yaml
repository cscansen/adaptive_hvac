force_evaluate:
  name: Force Evaluation
  description: Force immediate HVAC decision cycle (don't wait for next poll)

set_manual_override:
  name: Set Manual Override
  description: Enable or disable manual override (blocks all automation)
  fields:
    manual_override:
      name: Manual Override
      description: Enable (true) or disable (false) manual override
      required: true
      example: true
      selector:
        boolean:

rebuild_dashboard:
  name: Rebuild Dashboard
  description: Regenerate the Adaptive HVAC dashboard from the current zone setup and save it (no restart needed).
  fields:
    dashboard:
      name: Dashboard URL
      description: URL path of an existing UI-managed dashboard to overwrite.
      default: dashboard-hvac
      example: dashboard-hvac
      selector:
        text:
